# Fixed-input delivery. Verification is read-only; publication executes no project code.
# The tested tree removes this workflow. Never force-push over concurrent work.
name: core-protocol-publish-c1-c3
on:
  push:
    branches: [codex/compiler-recovery-fixes]
    paths: [.github/workflows/core-protocol-publish.yml]
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'skyfore/novel-world-harness' && github.event.head_commit.message == 'fix(ci): quote one-shot delivery condition and preserve exact baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Reconstruct only the fixed hash-pinned patch
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b6bab030a55515f4f7a6a64cd71b001bb348726f HEAD
          test "$(git diff --name-only b6bab030a55515f4f7a6a64cd71b001bb348726f HEAD)" = .github/workflows/core-protocol-publish.yml
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          chunks = ['c895a64e0ced41c59838e6976bfc8b1f0afb0506', 'd5fd62a4c49c6aea742a105155f71d396b561e19', 'd8da3f33c6e918d9644bc3f703edb61a9318ad86', '571c92c06175937c2fa8dd4ac8b97d1e85c1eda7']
          compressed = bytearray()
          for sha in chunks:
              request = urllib.request.Request('https://api.github.com/repos/skyfore/novel-world-harness/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['READ_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  record = json.load(response)
              assert record['encoding'] == 'base64' and record['sha'] == sha
              data = base64.b64decode(record['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              compressed.extend(data)
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '7b374ab7ea669f2c95e66db9d825fe139cb2e04cf412a29d678181ff62d7f624'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'core.patch').write_bytes(patch)
          PY
          git config user.name 'NWH verified delivery'
          git config user.email 'nwh-delivery@users.noreply.github.com'
          git am "$RUNNER_TEMP/core.patch"
          git rm .github/workflows/core-protocol-publish.yml
          git commit -m 'chore(ci): remove completed one-shot core protocol delivery'
          test "$(git rev-parse HEAD^{tree})" = f686f1024601f026e30cbc13564f4f284013ed65
          echo "NWH_HOME=$RUNNER_TEMP/nwh-core-verification" >> "$GITHUB_ENV"
      - run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:semantic-contracts
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
      - name: Freeze tested Git objects
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git rev-parse HEAD^{tree})" = f686f1024601f026e30cbc13564f4f284013ed65
          git bundle create "$RUNNER_TEMP/core-verified.bundle" b6bab030a55515f4f7a6a64cd71b001bb348726f..HEAD
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          result = {'base': 'b6bab030a55515f4f7a6a64cd71b001bb348726f', 'trigger': os.environ['GITHUB_SHA'], 'head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'tree': 'f686f1024601f026e30cbc13564f4f284013ed65', 'native': 'passed', 'types': 'passed', 'vitest': 'passed', 'build': 'passed'}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'core-verified.json').write_text(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: core-verified-c1-c3
          path: |
            ${{ runner.temp }}/core-verified.bundle
            ${{ runner.temp }}/core-verified.json
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b6bab030a55515f4f7a6a64cd71b001bb348726f
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: core-verified-c1-c3
          path: ${{ runner.temp }}/verified
      - name: Verify tested tree without running project code
        run: |
          set -euo pipefail
          git bundle verify "$RUNNER_TEMP/verified/core-verified.bundle"
          git fetch "$RUNNER_TEMP/verified/core-verified.bundle" HEAD
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD^{tree})" = f686f1024601f026e30cbc13564f4f284013ed65
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          test ! -e .github/workflows/core-protocol-publish.yml
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          manifest = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'verified/core-verified.json').read_text())
          assert manifest['base'] == 'b6bab030a55515f4f7a6a64cd71b001bb348726f'
          assert manifest['trigger'] == os.environ['GITHUB_SHA']
          assert manifest['head'] == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert manifest['tree'] == 'f686f1024601f026e30cbc13564f4f284013ed65'
          assert all(manifest[k] == 'passed' for k in ['native','types','vitest','build'])
          PY
      - name: Fast-forward only the unchanged requested branch
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/compiler-recovery-fixes | cut -f1)" = "$GITHUB_SHA"
          ASKPASS="$RUNNER_TEMP/nwh-publish-askpass"
          trap 'rm -f "$ASKPASS"' EXIT
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" x-access-token ;; *Password*) printf "%s\n" "$GH_TOKEN" ;; *) exit 1 ;; esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          GIT_ASKPASS="$ASKPASS" git push origin HEAD:refs/heads/codex/compiler-recovery-fixes
          git rev-parse HEAD
