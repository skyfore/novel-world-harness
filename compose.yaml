services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: novel_world
      POSTGRES_USER: novel_world
      POSTGRES_PASSWORD: novel_world
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel_world -d novel_world"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - novel_world_pg:/var/lib/postgresql/data

volumes:
  novel_world_pg:
