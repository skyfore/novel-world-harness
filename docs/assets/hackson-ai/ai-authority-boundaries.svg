<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">AI 上下文与权限隔离</title>
  <desc id="desc">编译器、角色意图解释器、世界裁决器和叙事渲染器使用不同上下文与窄化工具。它们的输出统一进入宿主验证边界，模型不能直接修改 canonical 模型或分支历史。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
    <style>
      .font{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}
      .title{font-size:25px;font-weight:700;fill:#0F172A}
      .subtitle{font-size:14px;fill:#64748B}
      .role{font-size:16px;font-weight:700;fill:#0F172A}
      .copy{font-size:12px;fill:#475569}
      .tag{font-size:11px;font-weight:700}
      .gate{font-size:16px;font-weight:700;fill:#FFFFFF}
    </style>
  </defs>

  <rect width="1200" height="600" rx="24" fill="url(#bg)"/>
  <g class="font">
    <text class="title" x="56" y="58">不是“一个万能 Agent”，而是四条最小权限 AI 通道</text>
    <text class="subtitle" x="56" y="84">上下文按职责切开：谁能看见什么、能提出什么、绝不能写入什么，都由宿主代码定义</text>

    <g filter="url(#shadow)">
      <rect x="48" y="126" width="250" height="230" rx="18" fill="#FFFFFF" stroke="#C7D2FE"/>
      <rect x="332" y="126" width="250" height="230" rx="18" fill="#FFFFFF" stroke="#BFDBFE"/>
      <rect x="616" y="126" width="250" height="230" rx="18" fill="#FFFFFF" stroke="#FED7AA"/>
      <rect x="900" y="126" width="252" height="230" rx="18" fill="#FFFFFF" stroke="#DDD6FE"/>
    </g>

    <!-- compiler -->
    <circle cx="83" cy="162" r="20" fill="#EEF2FF"/>
    <path d="M77 153l-7 9 7 9M89 153l7 9-7 9M87 148l-8 28" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="role" x="113" y="160">语义编译器</text>
    <text class="tag" x="113" y="180" fill="#4F46E5">SOURCE-OMNISCIENT</text>
    <text class="copy" x="70" y="218">可见：完整原文、当前 evidence batch</text>
    <text class="copy" x="70" y="244">可做：typed canonical proposal</text>
    <text class="copy" x="70" y="270">不可做：接受 proposal、提交世界事实</text>
    <rect x="70" y="294" width="206" height="34" rx="9" fill="#EEF2FF"/>
    <text class="tag" x="173" y="316" text-anchor="middle" fill="#4F46E5">未来 canon 仅在编译域可见</text>

    <!-- actor -->
    <circle cx="367" cy="162" r="20" fill="#EFF6FF"/>
    <circle cx="367" cy="156" r="6" fill="none" stroke="#2563EB" stroke-width="2"/>
    <path d="M355 174c1-8 5-11 12-11s11 3 12 11" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <text class="role" x="397" y="160">角色意图解释器</text>
    <text class="tag" x="397" y="180" fill="#2563EB">ACTOR-SCOPED</text>
    <text class="copy" x="354" y="218">可见：角色所知、所见与当前场景</text>
    <text class="copy" x="354" y="244">可做：提出受控行为与期望结果</text>
    <text class="copy" x="354" y="270">不可做：读取剧透、替世界决定结果</text>
    <rect x="354" y="294" width="206" height="34" rx="9" fill="#EFF6FF"/>
    <text class="tag" x="457" y="316" text-anchor="middle" fill="#2563EB">角色不知道的，模型也不知道</text>

    <!-- adjudicator -->
    <circle cx="651" cy="162" r="20" fill="#FFF7ED"/>
    <path d="M651 148v28M640 154h22M643 154l-7 11h14zM659 154l-7 11h14z" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="role" x="681" y="160">世界裁决器</text>
    <text class="tag" x="681" y="180" fill="#C2410C">WORLD-SCOPED PROPOSAL</text>
    <text class="copy" x="638" y="218">可见：当前事实、活动规则、预检问题</text>
    <text class="copy" x="638" y="244">可做：提出 realize / transform 后果</text>
    <text class="copy" x="638" y="270">不可做：绕过矛盾证明、直接 commit</text>
    <rect x="638" y="294" width="206" height="34" rx="9" fill="#FFF7ED"/>
    <text class="tag" x="741" y="316" text-anchor="middle" fill="#C2410C">世界阻力也必须有可验证依据</text>

    <!-- narrator -->
    <circle cx="935" cy="162" r="20" fill="#F5F3FF"/>
    <path d="M923 151h24v16h-13l-7 6v-6h-4zM928 157h14M928 162h9" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="role" x="965" y="160">叙事渲染器</text>
    <text class="tag" x="965" y="180" fill="#7C3AED">READ-ONLY RENDER</text>
    <text class="copy" x="922" y="218">可见：已提交历史与 actor-safe frame</text>
    <text class="copy" x="922" y="244">可做：生成有文学性的场景文本</text>
    <text class="copy" x="922" y="270">不可做：用新文案反写状态或知识</text>
    <rect x="922" y="294" width="208" height="34" rx="9" fill="#F5F3FF"/>
    <text class="tag" x="1026" y="316" text-anchor="middle" fill="#7C3AED">写得再精彩也不等于世界事实</text>

    <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <path d="M173 356V408"/>
      <path d="M457 356V408"/>
      <path d="M741 356V408"/>
      <path d="M1026 356V408"/>
    </g>

    <rect x="48" y="410" width="1104" height="74" rx="16" fill="#0F766E"/>
    <g transform="translate(72 425)" fill="none" stroke="#CCFBF1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 2l17 6v13c0 11-7 18-17 23C12 39 5 32 5 21V8z"/><path d="M13 21l6 6 12-14"/>
    </g>
    <text class="gate" x="132" y="442">统一宿主边界：schema、证据、可见性、规则、不变量、CAS 与 circuit breaker</text>
    <text x="132" y="466" font-size="12" fill="#CCFBF1">只有宿主代码能接受 canonical artifact 或提交 CommittedEvent；所有模型调用与工具轨迹都可检查。</text>

    <rect x="48" y="516" width="1104" height="42" rx="12" fill="#FFFFFF" stroke="#FCA5A5"/>
    <circle cx="75" cy="537" r="12" fill="#FEF2F2"/>
    <path d="M69 531l12 12M81 531l-12 12" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
    <text class="tag" x="100" y="541" fill="#991B1B">全局禁止：模型直接改文件、直接写 branch truth、把 future canon 泄漏给角色、让叙事文本成为状态更新</text>
  </g>
</svg>
