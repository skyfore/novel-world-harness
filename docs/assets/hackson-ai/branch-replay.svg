<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Canon、分支历史与可能性前沿</title>
  <desc id="desc">Canonical record 是编译器知道的完整原著轨迹。运行分支只把当前头之前的已提交事件视为真值，在分叉点后产生独立事件；原著未来只作为带条件的可能性，不会被强制调度。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
    <style>
      .font{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}
      .title{font-size:25px;font-weight:700;fill:#0F172A}
      .subtitle{font-size:14px;fill:#64748B}
      .lane{font-size:13px;font-weight:700}
      .event{font-size:12px;font-weight:700;fill:#FFFFFF}
      .copy{font-size:12px;fill:#475569}
      .tag{font-size:11px;font-weight:700}
    </style>
  </defs>

  <rect width="1200" height="580" rx="24" fill="url(#bg)"/>
  <g class="font">
    <text class="title" x="56" y="58">分支、回放与反事实：未来不是剧本</text>
    <text class="subtitle" x="56" y="84">同一个 frozen base 可以创建多个互不污染的世界实例，并用同一事件模型做 replay、diff 与继续演化</text>

    <rect x="48" y="118" width="1104" height="126" rx="18" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text class="lane" x="70" y="148" fill="#4F46E5">CANONICAL RECORD · 原著完整轨迹（编译与评估参考）</text>
    <path d="M144 194H1054" stroke="#A5B4FC" stroke-width="4" stroke-linecap="round"/>
    <g fill="#4F46E5">
      <circle cx="180" cy="194" r="13"/><circle cx="360" cy="194" r="13"/><circle cx="540" cy="194" r="13"/><circle cx="720" cy="194" r="13"/><circle cx="900" cy="194" r="13"/><circle cx="1040" cy="194" r="13"/>
    </g>
    <g class="event" text-anchor="middle">
      <text x="180" y="198">C0</text><text x="360" y="198">C1</text><text x="540" y="198">C2</text><text x="720" y="198">C3</text><text x="900" y="198">C4</text><text x="1040" y="198">C5</text>
    </g>
    <text class="copy" x="180" y="225" text-anchor="middle">开篇</text>
    <text class="copy" x="540" y="225" text-anchor="middle">分叉参考点</text>
    <text class="copy" x="900" y="225" text-anchor="middle">原著未来事件</text>

    <path d="M540 207V298" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <rect x="489" y="252" width="102" height="26" rx="13" fill="#F1F5F9"/>
    <text class="tag" x="540" y="269" text-anchor="middle" fill="#475569">fork at C2</text>

    <rect x="48" y="296" width="1104" height="142" rx="18" fill="#FFFFFF" stroke="#A7F3D0"/>
    <text class="lane" x="70" y="326" fill="#047857">ACTIVE BRANCH · 只以已提交事件为世界真值</text>
    <path d="M144 382H940" stroke="#6EE7B7" stroke-width="4" stroke-linecap="round"/>
    <g fill="#047857">
      <circle cx="180" cy="382" r="13"/><circle cx="360" cy="382" r="13"/><circle cx="540" cy="382" r="13"/><circle cx="700" cy="382" r="13"/><circle cx="860" cy="382" r="13"/>
    </g>
    <g class="event" text-anchor="middle">
      <text x="180" y="386">C0</text><text x="360" y="386">C1</text><text x="540" y="386">C2</text><text x="700" y="386">B3</text><text x="860" y="386">B4</text>
    </g>
    <circle cx="940" cy="382" r="18" fill="#FFFFFF" stroke="#047857" stroke-width="3"/>
    <path d="M932 382h16M940 374v16" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
    <text class="tag" x="940" y="417" text-anchor="middle" fill="#047857">branch head</text>
    <text class="copy" x="700" y="417" text-anchor="middle">玩家改变关键事件</text>
    <text class="copy" x="860" y="417" text-anchor="middle">新因果结果</text>

    <path d="M940 364C952 324 1000 315 1048 322" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <rect x="1005" y="291" width="125" height="64" rx="12" fill="#FFF7ED" stroke="#FED7AA" filter="url(#shadow)"/>
    <text class="tag" x="1067" y="315" text-anchor="middle" fill="#B45309">可能性前沿</text>
    <text class="copy" x="1067" y="335" text-anchor="middle">条件满足才可候选</text>

    <g filter="url(#shadow)">
      <rect x="48" y="478" width="254" height="66" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="330" y="478" width="254" height="66" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="612" y="478" width="254" height="66" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="894" y="478" width="258" height="66" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    </g>
    <text class="tag" x="175" y="504" text-anchor="middle" fill="#0F172A">Replay</text>
    <text class="copy" x="175" y="526" text-anchor="middle">从事件历史确定性重建状态</text>
    <text class="tag" x="457" y="504" text-anchor="middle" fill="#0F172A">Diff</text>
    <text class="copy" x="457" y="526" text-anchor="middle">比较两条分支的事实差异</text>
    <text class="tag" x="739" y="504" text-anchor="middle" fill="#0F172A">Canon replay</text>
    <text class="copy" x="739" y="526" text-anchor="middle">用原著检查世界模型是否缺失</text>
    <text class="tag" x="1023" y="504" text-anchor="middle" fill="#0F172A">Counterfactual</text>
    <text class="copy" x="1023" y="526" text-anchor="middle">让新历史自然产生新未来</text>
  </g>
</svg>
