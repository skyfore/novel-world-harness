<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">证据驱动的小说编译流程</title>
  <desc id="desc">小说从内容寻址导入开始，经确定性结构切分、AI 语义提案、证据和闭包验证、人工审阅，最终形成不可变 canonical revision；失败项进入修复或隔离。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4F46E5"/>
    </marker>
    <style>
      .font{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}
      .title{font-size:25px;font-weight:700;fill:#0F172A}
      .subtitle{font-size:14px;fill:#64748B}
      .step{font-size:16px;font-weight:700;fill:#0F172A}
      .copy{font-size:12px;fill:#475569}
      .number{font-size:12px;font-weight:700;fill:#FFFFFF}
      .tag{font-size:11px;font-weight:600}
    </style>
  </defs>

  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <g class="font">
    <text class="title" x="56" y="58">编译流程：AI 提案，系统验证，人来决定</text>
    <text class="subtitle" x="56" y="84">每个世界对象都能回到原文证据；模型失败不会污染 canonical 世界模型</text>

    <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <path d="M194 202H232"/>
      <path d="M380 202H418"/>
      <path d="M566 202H604"/>
      <path d="M752 202H790"/>
      <path d="M938 202H976"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="48" y="126" width="146" height="152" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="234" y="126" width="146" height="152" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
      <rect x="420" y="126" width="146" height="152" rx="16" fill="#FFFFFF" stroke="#C7D2FE"/>
      <rect x="606" y="126" width="146" height="152" rx="16" fill="#FFFFFF" stroke="#99F6E4"/>
      <rect x="792" y="126" width="146" height="152" rx="16" fill="#FFFFFF" stroke="#FDE68A"/>
      <rect x="978" y="126" width="174" height="152" rx="16" fill="#FFFFFF" stroke="#A7F3D0"/>
    </g>

    <g>
      <circle cx="74" cy="150" r="14" fill="#475569"/><text class="number" x="74" y="154" text-anchor="middle">1</text>
      <circle cx="260" cy="150" r="14" fill="#475569"/><text class="number" x="260" y="154" text-anchor="middle">2</text>
      <circle cx="446" cy="150" r="14" fill="#4F46E5"/><text class="number" x="446" y="154" text-anchor="middle">3</text>
      <circle cx="632" cy="150" r="14" fill="#0F766E"/><text class="number" x="632" y="154" text-anchor="middle">4</text>
      <circle cx="818" cy="150" r="14" fill="#B45309"/><text class="number" x="818" y="154" text-anchor="middle">5</text>
      <circle cx="1004" cy="150" r="14" fill="#047857"/><text class="number" x="1004" y="154" text-anchor="middle">6</text>
    </g>

    <!-- step icons -->
    <g transform="translate(100 153)" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 12h28v25H7zM11 7h20l4 5H7zM14 20h14M14 26h14"/>
    </g>
    <text class="step" x="121" y="220" text-anchor="middle">安全导入</text>
    <text class="copy" x="121" y="245" text-anchor="middle">UTF-8 / SHA-256</text>
    <text class="copy" x="121" y="263" text-anchor="middle">不可变内容归档</text>

    <g transform="translate(286 153)" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="7" width="28" height="31" rx="3"/><path d="M13 15h16M13 22h16M13 29h10"/>
    </g>
    <text class="step" x="307" y="220" text-anchor="middle">结构切分</text>
    <text class="copy" x="307" y="245" text-anchor="middle">章节 / 段落 / 句子</text>
    <text class="copy" x="307" y="263" text-anchor="middle">精确证据窗口</text>

    <g transform="translate(472 153)" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 5l3 9 9 3-9 3-3 9-3-9-9-3 9-3zM32 28l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    </g>
    <text class="step" x="493" y="220" text-anchor="middle">AI 语义提案</text>
    <text class="copy" x="493" y="245" text-anchor="middle">实体 / 事件 / 规则</text>
    <text class="copy" x="493" y="263" text-anchor="middle">关系 / 知识 / 地点</text>

    <g transform="translate(658 153)" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 5l14 5v10c0 9-6 15-14 19C13 35 7 29 7 20V10z"/><path d="M14 21l5 5 9-11"/>
    </g>
    <text class="step" x="679" y="220" text-anchor="middle">确定性验证</text>
    <text class="copy" x="679" y="245" text-anchor="middle">schema / 哈希 / 引用</text>
    <text class="copy" x="679" y="263" text-anchor="middle">时间 / 闭包 / 不变量</text>

    <g transform="translate(844 153)" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="21" cy="16" r="8"/><path d="M7 38c1-9 6-14 14-14s13 5 14 14M30 27l4 4 7-8"/>
    </g>
    <text class="step" x="865" y="220" text-anchor="middle">显式审阅</text>
    <text class="copy" x="865" y="245" text-anchor="middle">接受 / 修复 / 隔离</text>
    <text class="copy" x="865" y="263" text-anchor="middle">保留完整审计轨迹</text>

    <g transform="translate(1043 153)" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 13l14-8 14 8v17l-14 8-14-8zM7 13l14 8 14-8M21 21v17"/>
    </g>
    <text class="step" x="1065" y="220" text-anchor="middle">Canonical Revision</text>
    <text class="copy" x="1065" y="245" text-anchor="middle">逻辑 ID 与内容版本分离</text>
    <text class="copy" x="1065" y="263" text-anchor="middle">可验证、可回滚、可复用</text>

    <!-- retry lane -->
    <path d="M865 278V342H679V302" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-indigo)"/>
    <rect x="724" y="320" width="98" height="26" rx="13" fill="#EEF2FF"/>
    <text class="tag" x="773" y="337" text-anchor="middle" fill="#4F46E5">有界修复一次</text>

    <rect x="48" y="390" width="1104" height="196" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text class="step" x="74" y="426">为什么这条流水线适合高风险生成式 AI 场景？</text>

    <g transform="translate(74 453)">
      <circle cx="15" cy="15" r="15" fill="#EEF2FF"/><path d="M9 15l4 4 8-9" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="tag" x="42" y="12" fill="#0F172A">证据可追溯</text>
      <text class="copy" x="42" y="32">每个关键字段都能定位到原文字节与 quote hash</text>
    </g>
    <g transform="translate(420 453)">
      <circle cx="15" cy="15" r="15" fill="#ECFDF5"/><path d="M15 7v16M8 15h14" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
      <text class="tag" x="42" y="12" fill="#0F172A">失败可恢复</text>
      <text class="copy" x="42" y="32">批次可续跑，草稿可修复，未通过内容不进入权威模型</text>
    </g>
    <g transform="translate(796 453)">
      <circle cx="15" cy="15" r="15" fill="#FFF7ED"/><path d="M8 15h14M15 8v14" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
      <text class="tag" x="42" y="12" fill="#0F172A">权限最小化</text>
      <text class="copy" x="42" y="32">模型只拥有窄化 typed proposal 工具，没有通用写权限</text>
    </g>

    <rect x="74" y="526" width="1052" height="38" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text class="tag" x="600" y="550" text-anchor="middle" fill="#334155">权威性只沿一条方向增长：原文证据 → 已验证 proposal → 已接受 canonical artifact</text>
  </g>
</svg>
