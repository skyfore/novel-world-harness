<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">分支世界的一次 Move</title>
  <desc id="desc">玩家输入先由角色隔离的模型翻译为结构化意图，再由世界裁决模型提出结果，确定性门禁验证后提交事件。状态、知识、规则和可能性由历史派生，最后才渲染叙事。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7C3AED"/>
    </marker>
    <style>
      .font{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}
      .title{font-size:25px;font-weight:700;fill:#0F172A}
      .subtitle{font-size:14px;fill:#64748B}
      .step{font-size:16px;font-weight:700;fill:#0F172A}
      .copy{font-size:12px;fill:#475569}
      .tag{font-size:11px;font-weight:700}
      .lane{font-size:12px;font-weight:700;letter-spacing:.5px}
    </style>
  </defs>

  <rect width="1200" height="700" rx="24" fill="url(#bg)"/>
  <g class="font">
    <text class="title" x="56" y="58">运行流程：自由行动，但不自由篡改世界</text>
    <text class="subtitle" x="56" y="84">一次 Move 使用两个隔离的 AI 提案与一个确定性提交边界；普通失败也可以成为世界内事件</text>

    <rect x="48" y="116" width="1104" height="180" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text class="lane" x="70" y="145" fill="#4F46E5">PROPOSAL LANE · AI 推理区</text>

    <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)">
      <path d="M202 212H246"/>
      <path d="M438 212H482"/>
      <path d="M674 212H718"/>
      <path d="M910 212H954"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="70" y="166" width="132" height="92" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="248" y="166" width="190" height="92" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
      <rect x="484" y="166" width="190" height="92" rx="14" fill="#F5F3FF" stroke="#DDD6FE"/>
      <rect x="720" y="166" width="190" height="92" rx="14" fill="#FFF7ED" stroke="#FED7AA"/>
      <rect x="956" y="166" width="174" height="92" rx="14" fill="#F8FAFC" stroke="#CBD5E1"/>
    </g>

    <!-- player icon -->
    <g transform="translate(82 183)" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="13" cy="9" r="6"/><path d="M3 29c1-8 4-12 10-12s9 4 10 12"/>
    </g>
    <text class="step" x="139" y="201" text-anchor="middle">玩家输入</text>
    <text class="copy" x="139" y="226" text-anchor="middle">任意自然语言</text>
    <text class="copy" x="139" y="244" text-anchor="middle">或结构化快捷动作</text>

    <text class="step" x="343" y="197" text-anchor="middle">角色意图解释器</text>
    <text class="copy" x="343" y="221" text-anchor="middle">只看 actor-safe context</text>
    <text class="copy" x="343" y="241" text-anchor="middle">controlledAct ≠ desiredEffect</text>

    <text class="step" x="579" y="197" text-anchor="middle">确定性预检</text>
    <text class="copy" x="579" y="221" text-anchor="middle">当前位置 / 知识 / 资源</text>
    <text class="copy" x="579" y="241" text-anchor="middle">活动规则 / branch head</text>

    <text class="step" x="815" y="197" text-anchor="middle">世界裁决器</text>
    <text class="copy" x="815" y="221" text-anchor="middle">realize 或 transform</text>
    <text class="copy" x="815" y="241" text-anchor="middle">提出直接世界后果</text>

    <text class="step" x="1043" y="197" text-anchor="middle">结果 Proposal</text>
    <text class="copy" x="1043" y="221" text-anchor="middle">尚未成为事实</text>
    <text class="copy" x="1043" y="241" text-anchor="middle">保留审计证据</text>

    <path d="M1043 258V328" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="48" y="326" width="1104" height="134" rx="18" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text class="lane" x="70" y="355" fill="#047857">COMMIT GATE · 确定性权威边界</text>
    <g transform="translate(78 375)" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 3l18 7v13c0 12-7 20-18 25C13 43 6 35 6 23V10z"/><path d="M14 24l7 7 13-16"/>
    </g>
    <text class="step" x="148" y="393">Host 校验并执行 CAS 提交</text>
    <text class="copy" x="148" y="418">验证 scope、矛盾证书、空间、时间、规则、状态不变量与当前分支头；失败时不写入世界真值。</text>

    <rect x="760" y="374" width="170" height="54" rx="12" fill="#FFFFFF" stroke="#6EE7B7"/>
    <text class="tag" x="845" y="396" text-anchor="middle" fill="#047857">唯一权威写入</text>
    <text class="copy" x="845" y="416" text-anchor="middle">CommittedEvent + StateDelta</text>
    <path d="M936 401H1014" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1020" y="374" width="108" height="54" rx="12" fill="#047857"/>
    <text x="1074" y="397" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">新 Branch Head</text>
    <text x="1074" y="416" text-anchor="middle" font-size="11" fill="#D1FAE5">append-only</text>

    <path d="M1074 428V506" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <rect x="48" y="504" width="1104" height="144" rx="18" fill="#FFFFFF" stroke="#DDD6FE"/>
    <text class="lane" x="70" y="535" fill="#7C3AED">DERIVED + RENDER LANE · 投影与呈现</text>
    <g filter="url(#shadow)">
      <rect x="70" y="554" width="190" height="66" rx="12" fill="#F5F3FF" stroke="#DDD6FE"/>
      <rect x="290" y="554" width="190" height="66" rx="12" fill="#F5F3FF" stroke="#DDD6FE"/>
      <rect x="510" y="554" width="190" height="66" rx="12" fill="#F5F3FF" stroke="#DDD6FE"/>
      <rect x="730" y="554" width="190" height="66" rx="12" fill="#F5F3FF" stroke="#DDD6FE"/>
      <rect x="950" y="554" width="178" height="66" rx="12" fill="#FFF7ED" stroke="#FED7AA"/>
    </g>
    <text class="step" x="165" y="580" text-anchor="middle">WorldState</text>
    <text class="copy" x="165" y="602" text-anchor="middle">从事件历史归约</text>
    <text class="step" x="385" y="580" text-anchor="middle">角色知识</text>
    <text class="copy" x="385" y="602" text-anchor="middle">按可见性隔离</text>
    <text class="step" x="605" y="580" text-anchor="middle">活动规则</text>
    <text class="copy" x="605" y="602" text-anchor="middle">随时间版本化</text>
    <text class="step" x="825" y="580" text-anchor="middle">可能性前沿</text>
    <text class="copy" x="825" y="602" text-anchor="middle">满足条件才候选</text>
    <text class="step" x="1039" y="580" text-anchor="middle">叙事渲染</text>
    <text class="copy" x="1039" y="602" text-anchor="middle">只读已提交事实</text>

    <g fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)">
      <path d="M260 587H282"/>
      <path d="M480 587H502"/>
      <path d="M700 587H722"/>
      <path d="M920 587H942"/>
    </g>
    <text class="tag" x="600" y="673" text-anchor="middle" fill="#475569">核心不变量：渲染可以很有想象力，但只有验证通过的事件可以改变世界</text>
  </g>
</svg>
